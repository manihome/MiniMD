<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiniMD</title>
  <link rel="stylesheet" href="/src/styles/main.css">
  <link rel="stylesheet" href="/src/styles/editor.css">
  <link rel="stylesheet" href="/src/styles/print.css">
</head>
<body>
  <div id="app">
    <!-- 顶部工具栏 -->
    <header id="toolbar" class="toolbar">
      <div class="toolbar-left">
        <button id="btn-docs" class="toolbar-btn" title="文档列表" aria-label="文档列表">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/>
          </svg>
        </button>
        <button id="btn-new" class="toolbar-btn" title="新建 (Ctrl+N)" aria-label="新建文档">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
            <polyline points="14,2 14,8 20,8"/>
            <line x1="12" y1="11" x2="12" y2="17"/>
            <line x1="9" y1="14" x2="15" y2="14"/>
          </svg>
        </button>
        <span id="doc-title" class="doc-title">无标题文档</span>
        <button id="btn-save" class="toolbar-btn" title="保存 (Ctrl+S)" aria-label="保存">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/>
            <polyline points="17,21 17,13 7,13 7,21"/>
            <polyline points="7,3 7,8 15,8"/>
          </svg>
        </button>
      </div>
      <div class="toolbar-center">
        <span id="save-status" class="save-status"></span>
      </div>
      <div class="toolbar-right">
        <button id="btn-export" class="toolbar-btn" title="导出" aria-label="导出">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
            <polyline points="7,10 12,15 17,10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
        </button>
        <button id="btn-settings" class="toolbar-btn" title="设置 (Ctrl+,)" aria-label="设置">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- 侧边栏 - 文档列表 -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-title">文档列表</span>
        <button id="btn-collapse-sidebar" class="toolbar-btn" title="收起" aria-label="收起侧边栏">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <polyline points="15,18 9,12 15,6"/>
          </svg>
        </button>
      </div>
      <div id="doc-list" class="doc-list"></div>
    </aside>

    <!-- 主编辑区 -->
    <main id="editor-area" class="editor-area">
      <div id="editor-wrapper" class="editor-wrapper">
        <div id="editor" class="editor" contenteditable="true" spellcheck="true"></div>
      </div>
    </main>

    <!-- 底部状态栏 -->
    <footer id="statusbar" class="statusbar">
      <div class="status-left">
        <span id="word-count" class="status-item">0 字</span>
        <span id="line-count" class="status-item">0 行</span>
      </div>
      <div class="status-right">
        <span id="storage-info" class="status-item">localStorage</span>
      </div>
    </footer>

    <!-- 设置面板 -->
    <div id="settings-modal" class="modal-overlay hidden">
      <div class="modal settings-modal">
        <div class="modal-header">
          <span class="modal-title">排版设置</span>
          <button id="btn-close-settings" class="toolbar-btn" aria-label="关闭设置">✕</button>
        </div>
        <div class="modal-body settings-body">
          <div class="settings-section">
            <h3 class="settings-section-title">字体</h3>
            <div class="setting-row">
              <label class="setting-label">正文字体</label>
              <select id="setting-font-family" class="setting-select"></select>
            </div>
            <div class="setting-row">
              <label class="setting-label">等宽字体（代码块）</label>
              <select id="setting-font-mono" class="setting-select"></select>
            </div>
          </div>

          <div class="settings-section">
            <h3 class="settings-section-title">字号</h3>
            <div class="setting-row">
              <label class="setting-label">正文字号</label>
              <div class="setting-slider-row">
                <input type="range" id="setting-font-size" min="12" max="24" step="0.5" value="16">
                <span class="setting-value">16px</span>
              </div>
            </div>
            <div class="setting-row">
              <label class="setting-label">H1 字号</label>
              <div class="setting-slider-row">
                <input type="range" id="setting-h1-size" min="20" max="48" step="1" value="28">
                <span class="setting-value">28px</span>
              </div>
            </div>
            <div class="setting-row">
              <label class="setting-label">H2 字号</label>
              <div class="setting-slider-row">
                <input type="range" id="setting-h2-size" min="16" max="36" step="1" value="22">
                <span class="setting-value">22px</span>
              </div>
            </div>
            <div class="setting-row">
              <label class="setting-label">H3 字号</label>
              <div class="setting-slider-row">
                <input type="range" id="setting-h3-size" min="14" max="28" step="1" value="18">
                <span class="setting-value">18px</span>
              </div>
            </div>
          </div>

          <div class="settings-section">
            <h3 class="settings-section-title">行与段落</h3>
            <div class="setting-row">
              <label class="setting-label">行高</label>
              <div class="setting-slider-row">
                <input type="range" id="setting-line-height" min="1.2" max="2.5" step="0.05" value="1.6">
                <span class="setting-value">1.6</span>
              </div>
            </div>
            <div class="setting-row">
              <label class="setting-label">段间距</label>
              <div class="setting-slider-row">
                <input type="range" id="setting-paragraph-spacing" min="4" max="32" step="1" value="16">
                <span class="setting-value">16px</span>
              </div>
            </div>
          </div>

          <div class="settings-section">
            <h3 class="settings-section-title">颜色</h3>
            <div class="setting-row">
              <label class="setting-label">文本颜色</label>
              <input type="color" id="setting-text-color" value="#111111" class="setting-color">
            </div>
            <div class="setting-row">
              <label class="setting-label">链接颜色</label>
              <input type="color" id="setting-link-color" value="#555555" class="setting-color">
            </div>
            <div class="setting-row">
              <label class="setting-label">引用左边框</label>
              <input type="color" id="setting-quote-color" value="#333333" class="setting-color">
            </div>
            <div class="setting-row">
              <label class="setting-label">代码块背景</label>
              <input type="color" id="setting-code-bg" value="#f5f5f5" class="setting-color">
            </div>
            <div class="setting-row">
              <label class="setting-label">编辑器背景</label>
              <input type="color" id="setting-editor-bg" value="#ffffff" class="setting-color">
            </div>
          </div>

          <div class="settings-section">
            <h3 class="settings-section-title">布局</h3>
            <div class="setting-row">
              <label class="setting-label">最大内容宽度</label>
              <div class="setting-slider-row">
                <input type="range" id="setting-max-width" min="600" max="900" step="10" value="720">
                <span class="setting-value">720px</span>
              </div>
            </div>
            <div class="setting-row">
              <label class="setting-label">编辑器边距</label>
              <div class="setting-slider-row">
                <input type="range" id="setting-padding" min="16" max="64" step="2" value="32">
                <span class="setting-value">32px</span>
              </div>
            </div>
          </div>

          <div class="settings-section">
            <h3 class="settings-section-title">预设方案</h3>
            <div class="preset-buttons">
              <button class="preset-btn" data-preset="default">默认</button>
              <button class="preset-btn" data-preset="compact">紧凑</button>
              <button class="preset-btn" data-preset="comfortable">舒适</button>
              <button class="preset-btn" data-preset="large">大号字</button>
              <button class="preset-btn" data-preset="minimal">极简</button>
              <button class="preset-btn" data-preset="serif">衬线体</button>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button id="btn-reset-settings" class="btn-secondary">恢复默认</button>
          <button id="btn-apply-settings" class="btn-primary">应用</button>
        </div>
      </div>
    </div>

    <!-- 导出菜单 -->
    <div id="export-menu" class="dropdown-menu hidden">
      <button id="btn-export-html" class="dropdown-item">导出 HTML</button>
      <button id="btn-export-pdf" class="dropdown-item">导出 PDF</button>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
